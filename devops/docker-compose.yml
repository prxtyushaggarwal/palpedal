version: '3.8'

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: palpedal_postgres
    restart: always
    environment:
      POSTGRES_DB: palpedal_db
      POSTGRES_USER: palpedal_user
      POSTGRES_PASSWORD: palpedal_secure_password_2026
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palpedal_user -d palpedal_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - palpedal_net

  # 2. Redis Cache & Broker
  redis:
    image: redis:7-alpine
    container_name: palpedal_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - palpedal_net

  # 3. Django REST API Backend
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: palpedal_backend
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 cycle_sharing.wsgi:application"
    volumes:
      - ../backend:/app
      - static_volume:/app/staticfiles
    environment:
      DEBUG: "False"
      SECRET_KEY: "prod-palpedal-super-secret-key-2026"
      DB_ENGINE: "postgres"
      POSTGRES_DB: palpedal_db
      POSTGRES_USER: palpedal_user
      POSTGRES_PASSWORD: palpedal_secure_password_2026
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
    networks:
      - palpedal_net

  # 4. Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: palpedal_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
    depends_on:
      - backend
    networks:
      - palpedal_net

volumes:
  pg_data:
  static_volume:

networks:
  palpedal_net:
    driver: bridge
