name: PalPedal CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Job 1: Linting and Code Quality
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 Code Quality Scan
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend/core/ --count --select=E9,F63,F7,F82 --show-source --statistics

  # Job 2: Automated Testing with PostgreSQL
  test:
    name: Backend Test Suite (PostgreSQL Matrix)
    runs-on: ubuntu-latest
    needs: lint
    env:
      # CI must use a throwaway key; production continues to require its own secret.
      SECRET_KEY: ci-only-not-for-production
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: palpedal_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Database Migrations
        env:
          DB_ENGINE: postgres
          POSTGRES_DB: palpedal_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          cd backend
          python manage.py migrate

      - name: Execute Automated Unit & Integration Tests
        env:
          DB_ENGINE: postgres
          POSTGRES_DB: palpedal_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          cd backend
          python manage.py test core --verbosity 2

  # Job 3: Docker Container Build
  docker-build:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build PalPedal Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: palpedal-backend:latest
